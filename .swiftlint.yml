# .swiftlint.yml

# Nicht prüfen
excluded:
  - Pods
  - Carthage
  - DerivedData
  - .build
  - build
  - Packages
  - ElyraBudgetTests
  - ElyraBudgetUITests

# Standardregeln deaktivieren
disabled_rules:
  - trailing_whitespace
  - todo
  - large_tuple
  - opening_brace

# Sinnvolle zusätzliche Regeln
opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - force_unwrapping
  - sorted_imports
  - vertical_parameter_alignment_on_call

# Zeilenlänge
line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

# Dateigröße
file_length:
  warning: 550
  error: 800
  ignore_comment_only_lines: true

# Größe von Views / Structs
type_body_length:
  warning: 400
  error: 600

# Funktionsgröße
function_body_length:
  warning: 80
  error: 120

# Komplexität
cyclomatic_complexity:
  warning: 15
  error: 25

# Identifier
identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
    error: 70
  excluded:
    - id
    - x
    - y
    - i
    - j

# Reporter
reporter: xcode
